name: build-gate

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:
    inputs:
      run_winget_smoke:
        description: Run winget smoke tests
        required: false
        default: false
        type: boolean

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.13.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          $nsisVersion = & (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe') /VERSION
          if ($LASTEXITCODE -ne 0 -or $nsisVersion -ne 'v3.13') { throw "Unexpected NSIS compiler: $nsisVersion" }
          Write-Host "NSIS compiler: $nsisVersion"

      - name: Build Gate
        shell: pwsh
        run: |
          $buildGateParameters = @{
            Task = 'Check'
            Configuration = 'Release'
            NonInteractive = $true
          }

          if ('${{ github.event.inputs.run_winget_smoke }}' -eq 'true') {
            $buildGateParameters.RunWingetSmoke = $true
          }

          ./scripts/run.ps1 @buildGateParameters

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlywinget-build-gate
          path: |
            artifacts/build-report.txt
            artifacts/check/*.log
            artifacts/dist/OnlyWinget/Release/*-setup.exe
            artifacts/dist/OnlyWinget/Release/*-portable-x64.zip
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.log
          if-no-files-found: error
