name: release-automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package Release Assets
        shell: pwsh
        run: |
          ./scripts/run.ps1 -Task Package -Configuration Release -NonInteractive

      - name: Package MSIX Asset
        shell: pwsh
        env:
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
        run: |
          ./scripts/run.ps1 -Task PackageMsix -Configuration Release -NonInteractive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: OnlyWinget Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/dist/OnlyWinget/Release/*-setup.exe
            artifacts/dist/OnlyWinget/Release/*-portable-x64.zip
            artifacts/dist/OnlyWinget/Release/msi/*.msi
            artifacts/msix/*.msix
